# Infraestrutura de desenvolvimento.
#
# Três bancos porque são três naturezas de dado diferentes, e forçá-las no mesmo
# lugar custa caro dos dois lados:
#
#   postgres    cadastro e política — cerca, ponto, perfil, embarque, credencial.
#               Volume baixo, leitura por id, e a consistência importa: um
#               embarque meio aplicado é pior que um embarque recusado.
#
#   clickhouse  telemetria — posição, evento de sensor, leitura de canal. Volume
#               alto, escrita em lote, leitura por janela de tempo e por
#               veículo. Em Postgres isso vira tabela de bilhões de linhas com
#               índice maior que o dado.
#
#   minio       vídeo e imagem do MDVR, falando S3. A decisão de como a mídia
#               chega ao navegador ainda está em aberto (ver
#               docs/arquitetura/midia.md); o storage sobe desde já porque as
#               duas saídas possíveis precisam dele.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: avansat
      POSTGRES_PASSWORD: avansat
      POSTGRES_DB: avansat
    ports: ["5432:5432"]
    volumes:
      - "postgres:/var/lib/postgresql/data"
      # O esquema mora junto do domínio que ele serve, pela mesma regra de
      # fatia vertical do front. O compose só monta; não é ele que organiza.
      # Roda uma vez, na criação do volume — banco que já existe não reexecuta.
      - "../services/api/src/dominios/cercas/esquema.sql:/docker-entrypoint-initdb.d/10-cercas.sql:ro"
      - "../services/api/src/dominios/dispositivos/esquema.sql:/docker-entrypoint-initdb.d/20-dispositivos.sql:ro"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avansat"]
      interval: 5s
      timeout: 3s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_USER: avansat
      CLICKHOUSE_PASSWORD: avansat
      CLICKHOUSE_DB: telemetria
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports: ["8123:8123", "9000:9000"]
    volumes:
      - "clickhouse:/var/lib/clickhouse"
      - "./clickhouse:/docker-entrypoint-initdb.d:ro"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: avansat
      MINIO_ROOT_PASSWORD: avansat123
    ports: ["9002:9000", "9001:9001"]
    volumes: ["minio:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres:
  clickhouse:
  minio:
